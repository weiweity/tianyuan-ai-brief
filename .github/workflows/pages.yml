name: pages

# 历史站点冻结在 archive/；sites/ 只负责将历史站点与客服启动会编排成两个发布入口。
on:
  push:
    branches: [main]
    paths:
      - "archive/2026-07-31-ai-project-brief/**"
      - "archive/archive-manifest.json"
      - "sites/**"
      - "business-docs/01-客服Agent项目/09-客服Agent需求会汇报.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install deterministic browser
        run: npx playwright install --with-deps chromium
      - name: Install zsh for workspace path safety checks
        run: sudo apt-get install --yes zsh
      - name: Run all quality gates before deployment
        run: npm run test:all
      - name: Stage public historical Web and safe kickoff artifact
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: sites/dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
