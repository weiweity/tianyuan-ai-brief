name: quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web-decision-brief

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-decision-brief/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install deterministic browser
        run: npx playwright install --with-deps chromium

      - name: Install zsh for workspace path safety checks
        run: sudo apt-get install --yes zsh

      - name: Run all quality gates
        run: npm run test:all

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-web-quality-evidence
          # 公共仓库只上传历史 Web 的视觉证据；客服立项证据留在受控本地环境。
          path: web-decision-brief/test-results/
          if-no-files-found: ignore
          retention-days: 14
