name: quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sites

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.pages.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sites/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: business-docs/08-工具/requirements-customer-agent-tools.txt

      - name: Install customer-agent Python dependencies
        run: python3 -m pip install --requirement ../business-docs/08-工具/requirements-customer-agent-tools.txt

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install deterministic browser
        run: npx playwright install --with-deps chromium

      - name: Install zsh for workspace path safety checks
        run: sudo apt-get install --yes zsh

      - name: Run all quality gates
        run: npm run test:release

      - name: Select trusted Pages candidate
        id: pages
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { shouldPublishPages } from './scripts/quality-plan.mjs';
          const publish = shouldPublishPages(process.env);
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`);
          JS

      - name: Stage verified public artifact
        if: steps.pages.outputs.publish == 'true'
        run: |
          npm run build:pages
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload Pages artifact from this verified checkout
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: sites/dist/pages

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-web-quality-evidence
          # 公共仓库只上传历史 Web 的视觉证据；客服立项证据留在受控本地环境。
          path: sites/test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: test
    if: needs.test.outputs.publish == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
