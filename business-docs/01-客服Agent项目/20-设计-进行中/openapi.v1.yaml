        text_storage_status:
          type: string
          enum: [stored, suppressed]
        platform:
          $ref: '#/components/schemas/Platform'
        platform_source:
          $ref: '#/components/schemas/PlatformSource'
        hit_status:
          $ref: '#/components/schemas/HitStatus'
        outcome:
          oneOf:
            - $ref: '#/components/schemas/AdoptionOutcome'
