      required: [items, next_cursor, scope]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderRecord'
        next_cursor:
          type: [string, 'null']
        scope:
          $ref: '#/components/schemas/WorkOrderAnalysisScope'

    ImportStatus:
      type: string
      enum: [validating, failed, staged, publishing, published, rolled_back]
      description: |
        published 是 batch 终态；后续 rollback 不修改原 batch。取消 validating/staged
        批次后也使用 failed，并在 error_report.code 中标记 CANCELLED。rolled_back 仅为
        旧数据只读兼容值，新迁移不再写入。
    ImportOperation:
      type: string
      enum: [upsert, withdraw]
      default: upsert
    FileImportRequest:
      type: object
      additionalProperties: false
      required: [file, source_bindings]
      description: |
        文件行由受控 worker 规范化为 ContentImportRowContract。行号不是 question_id 的输入。
        文件中不得含 placeholder values 或渲染后 Answer。
      x-normalized-row-schema:
        $ref: '#/components/schemas/ContentImportRowContract'
      properties:
        file:
          type: string
          format: binary
          description: 原始 CSV 或 XLSX 文件；文件名和 multipart boundary 不参与 request hash。
        source_bindings:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          x-unique-by: domain
          items:
            $ref: '#/components/schemas/AuthoritativeSourceBinding'
    FeishuImportRequest:
      type: object
      additionalProperties: false
      required: [source_type, source_bindings]
      description: |
        服务端读取的每行同样必须通过 ContentImportRowContract；结构/安全/来源失败整批失败，
        只有质量问题可进 quarantined。
      x-normalized-row-schema:
        $ref: '#/components/schemas/ContentImportRowContract'
      properties:
        source_type:
          const: feishu_api
        source_bindings:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          x-unique-by: domain
          items:
            $ref: '#/components/schemas/AuthoritativeSourceBinding'
          description: 服务端按登记表解析飞书定位与凭据；客户端不得提交内部 URL 或 token。
    ContentQualityStatus:
      type: string
      enum: [clean, quarantined]
    ContentQualityIssueCode:
      type: string
      enum:
        - UNKNOWN_INTENT
        - INTENT_MAPPING_REQUIRED
        - UNRESOLVED_CONFLICT
        - REVIEW_EVIDENCE_MISSING
        - QUESTION_DUPLICATE
        - QUESTION_HASH_MISMATCH
        - QUESTION_ORIGIN_UNVERIFIED
        - CONTENT_NEEDS_REVIEW
    ContentImportUpsertRow:
      type: object
      additionalProperties: false
      required:
        - staging_id
        - script_id
        - operation
        - category
        - title
        - answer_text
        - content_hash
        - source_version_id
        - owner_role
        - review_due_at
        - platform_scope
        - product_scope_type
        - product_scope_refs
        - effective_from
        - effective_to
        - intent_taxonomy_version
        - intent_id
        - risk_level
        - risk_categories
        - has_conflict
        - placeholder_keys
        - questions_json
        - questions_grams_text
        - title_grams_text
        - answer_grams_text
        - search_fallback_text
        - quality_status
        - quality_issue_codes
      properties:
        staging_id: { type: string, minLength: 1, maxLength: 128 }
        script_id: { type: string, minLength: 1, maxLength: 128 }
        operation: { const: upsert }
        category: { $ref: '#/components/schemas/ScriptCategory' }
        title: { type: string, minLength: 1, maxLength: 500 }
        answer_text:
          type: string
          minLength: 1
          maxLength: 10000
          description: 发布模板原文；只可含 placeholder_keys 声明的 `{订单号}`/`{日期}`。
        content_hash:
          $ref: '#/components/schemas/ContentHash'
          description: 引用受限审核服务已经绑定的目标治理快照；worker 不得据此自报审核主体。
        source_version_id: { $ref: '#/components/schemas/AuthoritativeSourceVersionId' }
        owner_role: { type: string, minLength: 1, maxLength: 128 }
        review_due_at: { type: string, format: date-time }
        platform_scope: { $ref: '#/components/schemas/PlatformScope' }
        product_scope_type: { $ref: '#/components/schemas/ProductScopeType' }
        product_scope_refs: { $ref: '#/components/schemas/ProductScopeRefs' }
        campaign_tag: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        effective_from: { type: string, format: date-time }
        effective_to:
          type: [string, 'null']
          format: date-time
          description: 排他上界；effective_to 非空时必须严格晚于 effective_from。
        intent_taxonomy_version: { $ref: '#/components/schemas/IntentTaxonomyVersion' }
        intent_id: { $ref: '#/components/schemas/IntentId' }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        risk_categories: { $ref: '#/components/schemas/RiskCategories' }
        has_conflict: { type: boolean }
        placeholder_keys:
          type: array
          uniqueItems: true
          maxItems: 2
          items: { $ref: '#/components/schemas/PlaceholderKey' }
        questions_json:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/ContentQuestion' }
        questions_grams_text: { type: string, minLength: 1, maxLength: 200000 }
        title_grams_text: { type: string, minLength: 1, maxLength: 20000 }
        answer_grams_text: { type: string, minLength: 1, maxLength: 200000 }
        search_fallback_text: { type: string, minLength: 1, maxLength: 20000 }
        quality_status: { $ref: '#/components/schemas/ContentQualityStatus' }
        quality_issue_codes:
          type: array
          uniqueItems: true
          maxItems: 8
          items: { $ref: '#/components/schemas/ContentQualityIssueCode' }
      allOf:
        - oneOf:
            - properties:
                product_scope_type: { const: storewide }
                product_scope_refs: { maxItems: 0 }
            - properties:
                product_scope_type: { enum: [category, sku] }
                product_scope_refs: { minItems: 1 }
        - oneOf:
            - properties:
                risk_level: { enum: [low, medium] }
                risk_categories: { maxItems: 0 }
            - properties:
                risk_level: { const: high }
                risk_categories: { minItems: 1 }
        - oneOf:
            - properties:
                quality_status: { const: clean }
                quality_issue_codes: { maxItems: 0 }
            - properties:
                quality_status: { const: quarantined }
                quality_issue_codes: { minItems: 1 }
    ContentImportWithdrawRow:
      type: object
      additionalProperties: false
      required:
        - staging_id
        - script_id
        - operation
        - category
        - source_version_id
        - quality_status
        - quality_issue_codes
      properties:
        staging_id: { type: string, minLength: 1, maxLength: 128 }
        script_id: { type: string, minLength: 1, maxLength: 128 }
        operation: { const: withdraw }
        category: { $ref: '#/components/schemas/ScriptCategory' }
        source_version_id: { $ref: '#/components/schemas/AuthoritativeSourceVersionId' }
        quality_status: { const: clean }
        quality_issue_codes: { type: array, maxItems: 0 }
    ContentImportRowContract:
      oneOf:
        - $ref: '#/components/schemas/ContentImportUpsertRow'
        - $ref: '#/components/schemas/ContentImportWithdrawRow'
      description: |
        这是受控 worker 到 SQL finalizer 的规范化行合同，不是新 HTTP route。placeholder values、
        渲染后 Answer、原始客户文本和内部飞书 token 均不在该 schema，因而不可入库。审核
        主体、审核 EVD、审核模式和 quality_gate_passed 也不在本合同；finalizer 只能从
        content_review_decisions 与受限质量 evidence 派生这些结论。
    ImportAcceptedResponse:
      type: object
      additionalProperties: false
      required: [import_batch_id, status, source_binding_hash]
      properties:
        import_batch_id:
          type: string
          minLength: 1
        status:
          const: validating
        source_binding_hash:
          $ref: '#/components/schemas/SourceBindingHash'
    ImportErrorReport:
      oneOf:
        - $ref: '#/components/schemas/ImportFailureReport'
        - type: 'null'
    ImportFailureReport:
      oneOf:
        - type: object
          additionalProperties: false
          required: [code, diagnostic_id]
          properties:
            code:
              const: CANCELLED
            diagnostic_id:
              $ref: '#/components/schemas/ImportDiagnosticId'
        - type: object
          additionalProperties: false
          required: [code, diagnostic_id, attempts, max_attempts]
          properties:
            code:
              const: MAX_ATTEMPTS_EXHAUSTED
            diagnostic_id:
              $ref: '#/components/schemas/ImportDiagnosticId'
            attempts:
              type: integer
              minimum: 1
            max_attempts:
              type: integer
              minimum: 1
        - type: object
          additionalProperties: false
          required: [code, diagnostic_id]
          properties:
            code:
              enum:
                - VALIDATION_FAILED
                - SOURCE_UNREADABLE
                - HASH_MISMATCH
                - UNSUPPORTED_FORMAT
                - STORAGE_UNAVAILABLE
                - SOURCE_NOT_ELIGIBLE
                - SOURCE_SUSPENDED
                - SOURCE_DOMAIN_MISMATCH
                - SOURCE_SNAPSHOT_MISMATCH
                - SOURCE_SET_INCOMPLETE
                - CONTENT_CONTRACT_INVALID
                - GOVERNANCE_HASH_MISMATCH
            diagnostic_id:
              $ref: '#/components/schemas/ImportDiagnosticId'
            row:
              type: integer
              minimum: 1
            column:
              type: integer
              minimum: 1
            error_count:
              type: integer
              minimum: 1
            issue_codes:
              type: array
              maxItems: 26
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ImportIssueCode'
    ImportDiagnosticId:
      type: string
      pattern: '^diag_[0-9a-f]{32}$'
      description: 由数据库随机 UUID 生成，仅用于运维关联受限诊断；不得由 worker、文件内容、路径或异常文本派生。
    ImportIssueCode:
      type: string
      enum:
        - MISSING_REQUIRED_FIELD
        - INVALID_FIELD_TYPE
        - INVALID_VALUE
        - DUPLICATE_SCRIPT_ID
        - UNKNOWN_SCRIPT_ID
        - INVALID_EFFECTIVE_WINDOW
        - MISSING_EFFECTIVE_WINDOW
        - HASH_MISMATCH
        - UNSUPPORTED_FORMAT
        - MACRO_DETECTED
        - EXTERNAL_LINK_DETECTED
        - ROW_LIMIT_EXCEEDED
        - CONTENT_TOO_LARGE
        - SOURCE_NOT_REGISTERED
        - SOURCE_NOT_CANONICAL
        - SOURCE_SUSPENDED
        - SOURCE_DOMAIN_MISMATCH
        - SOURCE_SNAPSHOT_MISMATCH
        - SOURCE_SET_INCOMPLETE
        - MISSING_PLATFORM_SCOPE
        - INVALID_PRODUCT_SCOPE
        - INVALID_TAXONOMY_REF
        - INVALID_QUESTION_IDENTITY
        - INVALID_REVIEW_EVIDENCE
        - INVALID_PLACEHOLDER_TEMPLATE
        - GOVERNANCE_HASH_MISMATCH
    ImportPreviewItem:
      type: object
      additionalProperties: false
      required:
        - script_id
        - operation
        - category
        - source_version_id
        - source_ref
        - quality_status
        - quality_issue_codes
        - quality_gate_passed
      properties:
        script_id:
          type: string
          minLength: 1
        operation:
          $ref: '#/components/schemas/ImportOperation'
        category:
          $ref: '#/components/schemas/ScriptCategory'
        source_version_id:
          $ref: '#/components/schemas/AuthoritativeSourceVersionId'
        source_ref:
          $ref: '#/components/schemas/SafeSourceRef'
        title:
          type:
            - string
            - 'null'
        answer_text:
          type:
            - string
            - 'null'
        content_hash:
          oneOf:
            - $ref: '#/components/schemas/ContentHash'
            - type: 'null'
        platform_scope:
          oneOf:
            - $ref: '#/components/schemas/PlatformScope'
            - type: 'null'
        product_scope_type:
          oneOf:
            - $ref: '#/components/schemas/ProductScopeType'
            - type: 'null'
        product_scope_refs:
          oneOf:
            - $ref: '#/components/schemas/ProductScopeRefs'
            - type: 'null'
        effective_from: { type: [string, 'null'], format: date-time }
        effective_to: { type: [string, 'null'], format: date-time }
        intent_taxonomy_version:
          oneOf:
            - $ref: '#/components/schemas/IntentTaxonomyVersion'
            - type: 'null'
        intent_id:
          oneOf:
            - $ref: '#/components/schemas/IntentId'
            - type: 'null'
        risk_level:
          oneOf:
            - $ref: '#/components/schemas/RiskLevel'
            - type: 'null'
        risk_categories:
          oneOf:
            - $ref: '#/components/schemas/RiskCategories'
            - type: 'null'
        has_conflict: { type: [boolean, 'null'] }
        review_mode:
          oneOf:
            - $ref: '#/components/schemas/ReviewMode'
            - type: 'null'
        primary_review_evd: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        secondary_review_evd: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        placeholder_keys:
          type: [array, 'null']
          uniqueItems: true
          maxItems: 2
          items: { $ref: '#/components/schemas/PlaceholderKey' }
        questions:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/ContentQuestion' }
        quality_status:
          $ref: '#/components/schemas/ContentQualityStatus'
        quality_issue_codes:
          type: array
          uniqueItems: true
          maxItems: 8
          items: { $ref: '#/components/schemas/ContentQualityIssueCode' }
        quality_gate_passed: { type: boolean }
    ContentQualityReviewSummary:
      type: object
      additionalProperties: false
      required:
        - plan_id
        - sampling_policy_version
        - cutoff_at
        - clean_population_count
        - ordinary_population_count
        - mandatory_full_review_count
        - initial_sample_target
        - expanded_sample_target
        - initial_sample_reviewed_count
        - initial_defect_count
        - expanded_sample_reviewed_count
        - expanded_defect_count
        - mandatory_reviewed_count
        - mandatory_defect_count
        - publishable_clean_count
        - review_quarantined_count
        - conclusion
        - evidence_ref
      properties:
        plan_id:
          type: string
          pattern: '^qplan_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'
        sampling_policy_version: { type: string, minLength: 1, maxLength: 128 }
        cutoff_at: { type: string, format: date-time }
        clean_population_count: { type: integer, minimum: 0, maximum: 5000 }
        ordinary_population_count: { type: integer, minimum: 0, maximum: 5000 }
        mandatory_full_review_count: { type: integer, minimum: 0, maximum: 5000 }
        initial_sample_target: { type: integer, minimum: 0, maximum: 5000 }
        expanded_sample_target: { type: integer, minimum: 0, maximum: 5000 }
        initial_sample_reviewed_count: { type: integer, minimum: 0, maximum: 5000 }
        initial_defect_count: { type: integer, minimum: 0, maximum: 5000 }
        expanded_sample_reviewed_count: { type: [integer, 'null'], minimum: 0, maximum: 5000 }
        expanded_defect_count: { type: [integer, 'null'], minimum: 0, maximum: 5000 }
        mandatory_reviewed_count: { type: integer, minimum: 0, maximum: 5000 }
        mandatory_defect_count: { type: integer, minimum: 0, maximum: 5000 }
        publishable_clean_count: { type: integer, minimum: 0, maximum: 5000 }
        review_quarantined_count: { type: integer, minimum: 0, maximum: 5000 }
        conclusion: { type: string, enum: [passed, blocked] }
        evidence_ref: { type: string, minLength: 1, maxLength: 256 }
      description: |
        服务端受限证据投影；不是上传文件或普通 worker 可写字段。high/conflict 行计入
        mandatory_full_review_count 并 100% 复核。
    ImportStatusResponseBase:
      type: object
      additionalProperties: false
      required:
        - import_batch_id
        - status
        - base_release_id
        - source_binding_hash
        - source_bindings
        - error_report
        - staged_count
        - clean_count
        - quarantined_count
        - quality_gate_passed
        - quality_review
        - preview
      properties:
        import_batch_id:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/ImportStatus'
        base_release_id:
          type: [string, 'null']
          description: enqueue 时锁定的 current release；首次发布前为 null。
        source_binding_hash:
          $ref: '#/components/schemas/SourceBindingHash'
        source_bindings:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          x-unique-by: domain
          items:
            $ref: '#/components/schemas/AuthoritativeSourceBindingStatus'
        error_report:
          $ref: '#/components/schemas/ImportErrorReport'
        staged_count:
          type: integer
          minimum: 0
        clean_count:
          type: integer
          minimum: 0
        quarantined_count:
          type: integer
          minimum: 0
        quality_gate_passed:
          type: boolean
          description: 至少一条 clean 行通过批次抽检门；不代表 quarantined 行可发布。
        quality_review:
          oneOf:
            - $ref: '#/components/schemas/ContentQualityReviewSummary'
            - type: 'null'
          description: validating/failed 尚无完整证据时可为 null；进入 staged 前必须已通过。
        preview:
          type: array
          items:
            $ref: '#/components/schemas/ImportPreviewItem'
    ImportStatusResponse:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/ImportStatusResponseBase'
            - type: object
              properties:
                status:
                  const: failed
                error_report:
                  $ref: '#/components/schemas/ImportFailureReport'
        - allOf:
            - $ref: '#/components/schemas/ImportStatusResponseBase'
            - type: object
              properties:
                status:
                  enum: [validating, staged, publishing, published, rolled_back]
                error_report:
                  type: 'null'
    CancelImportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type:
            - string
            - 'null'
    CancelImportResponse:
      type: object
      required: [ok, import_batch_id, status]
      properties:
        ok:
          const: true
        import_batch_id:
          type: string
          minLength: 1
        status:
          const: failed
    PublishRequest:
      type: object
      required: [import_batch_id, title, summary]
      properties:
        import_batch_id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        summary:
          type:
            - string
            - 'null'
    PublishResponse:
      type: object
      required: [release_id, release_seq, announcement_id, source_binding_hash]
      properties:
        release_id:
          type: string
          minLength: 1
        release_seq:
          type: integer
          minimum: 1
        announcement_id:
          type: string
          minLength: 1
        source_binding_hash:
          $ref: '#/components/schemas/SourceBindingHash'
    RollbackRequest:
      type: object
      required: [target_release_id, title, summary]
      properties:
        target_release_id:
          type: string
          minLength: 1
        title:
          type:
            - string
            - 'null'
        summary:
          type:
            - string
            - 'null'
    RollbackResponse:
      allOf:
        - $ref: '#/components/schemas/PublishResponse'
        - type: object
          required: [rollback_of_release_id]
          properties:
            rollback_of_release_id:
              type: string
              minLength: 1

    Announcement:
      type: object
      additionalProperties: false
      description: 公开公告的封闭白名单投影；不得透传创建主体或内部定位字段。
      required: [title, summary, created_at]
      properties:
        title:
          type: string
        summary:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
    CurrentAnnouncementResponse:
      type: object
      additionalProperties: false
      description: handler 必须显式映射顶层、offline_lease 与 announcement 白名单。
      required: [current_release_id, release_seq, source_binding_hash, offline_lease, announcement]
      properties:
        current_release_id:
          type: string
          minLength: 1
        release_seq:
          type: integer
          minimum: 1
        source_binding_hash:
          $ref: '#/components/schemas/SourceBindingHash'
        offline_lease:
          $ref: '#/components/schemas/OfflineSnapshotLease'
        announcement:
          oneOf:
            - $ref: '#/components/schemas/Announcement'
            - type: 'null'
    PublicSnapshotQuestion:
      type: object
      additionalProperties: false
      description: |
        离线检索所需的最小 Question 投影。禁止暴露 origin HMAC/密钥版本、
        source_query_id、source_asset_id、promotion review、role 或时间字段。
      required: [question_id, question_version, question_text, question_hash, semantic_family_id]
      properties:
        question_id:
          type: string
          pattern: '^q_[A-Za-z0-9][A-Za-z0-9_-]{7,126}$'
        question_version: { type: integer, minimum: 1 }
        question_text: { type: string, minLength: 1, maxLength: 500 }
        question_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        semantic_family_id:
          type: string
          pattern: '^sf_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'
    SnapshotItem:
      type: object
      additionalProperties: false
      description: |
        固定 release 中的不可变、封闭公开投影。响应中出现不代表该项当前有效；
        客户端每次检索都必须自行执行有效期过滤。禁止 DB row/internal object spread。
      required:
        - script_id
        - script_version
        - content_hash
        - title
        - category
        - answer_text
        - platform_scope
        - product_scope_type
        - product_scope_refs
        - effective_from
        - effective_to
        - intent_taxonomy_version
        - intent_id
        - risk_level
        - risk_categories
        - has_conflict
        - placeholder_keys
        - questions
      properties:
        script_id:
          type: string
          minLength: 1
        script_version:
          type: integer
          minimum: 1
        content_hash:
          $ref: '#/components/schemas/ContentHash'
        title:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/ScriptCategory'
        answer_text:
          type: string
          minLength: 1
        platform_scope:
          $ref: '#/components/schemas/PlatformScope'
        product_scope_type:
          $ref: '#/components/schemas/ProductScopeType'
        product_scope_refs:
          $ref: '#/components/schemas/ProductScopeRefs'
        effective_from:
          type: string
          format: date-time
          description: |
            包含下界。完整 release snapshot 可包含未到生效时间的项；
            客户端只能在 `effective_from <= now` 时将其纳入本地检索。
        effective_to:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            排他上界。完整 release snapshot 可包含已过期项，服务端不按当前时间过滤；
            客户端只能在 `effective_to IS NULL OR now < effective_to` 时纳入本地检索，
            `now == effective_to` 必须排除。
        intent_taxonomy_version:
          $ref: '#/components/schemas/IntentTaxonomyVersion'
        intent_id:
          $ref: '#/components/schemas/IntentId'
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        risk_categories:
          $ref: '#/components/schemas/RiskCategories'
        has_conflict: { type: boolean }
        placeholder_keys:
          type: array
          uniqueItems: true
          maxItems: 2
          items: { $ref: '#/components/schemas/PlaceholderKey' }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/PublicSnapshotQuestion'
      allOf:
        - oneOf:
            - properties:
                product_scope_type: { const: storewide }
                product_scope_refs: { maxItems: 0 }
            - properties:
                product_scope_type: { enum: [category, sku] }
                product_scope_refs: { minItems: 1 }
        - oneOf:
            - properties:
                risk_level: { enum: [low, medium] }
                risk_categories: { maxItems: 0 }
            - properties:
                risk_level: { const: high }
                risk_categories: { minItems: 1 }
    SnapshotResponse:
      type: object
      additionalProperties: false
      description: |
        固定 release 的完整、不可变分页快照响应。页集合不按生效时间改变；
        租约有效时，客户端每次本地检索必须再执行每项的时间窗口过滤。
      required: [release_id, release_seq, source_binding_hash, offline_lease, items, next_cursor]
      properties:
        release_id:
          type: string
          minLength: 1
        release_seq:
          type: integer
          minimum: 1
        source_binding_hash:
          $ref: '#/components/schemas/SourceBindingHash'
        offline_lease:
          $ref: '#/components/schemas/OfflineSnapshotLease'
        items:
          type: array
          description: 当页完整快照项；不是“当前有效项”的服务端过滤结果。
          items:
            $ref: '#/components/schemas/SnapshotItem'
        next_cursor:
          type:
            - string
            - 'null'
          description: 本页最后一个 script_id；无更多时为 null。
    AnnouncementAckRequest:
      type: object
      additionalProperties: false
      required: [client_id, release_id, release_seq, offline_lease_token]
      properties:
        client_id:
          type: string
          minLength: 1
        release_id:
          type: string
          minLength: 1
        release_seq:
          type: integer
          minimum: 1
        offline_lease_token:
          $ref: '#/components/schemas/OfflineSnapshotLeaseToken'
    OkResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true

    PolicyFlagKey:
      type: string
      enum: [rewrite, auto_send, autofill_adapter, llm_ranker, metrics_experimental_kpi]
    MutablePolicyFlagKey:
      type: string
      enum: [autofill_adapter, llm_ranker, metrics_experimental_kpi]
    Phase1HardOffPolicyFlagKey:
      type: string
      enum: [rewrite, auto_send]
    PolicyResponse:
      type: object
      required: [rewrite, auto_send, autofill_adapter, llm_ranker, metrics_experimental_kpi, auth_mode]
      properties:
        rewrite:
          const: false
          description: Phase 1 hard-off。
        auto_send:
          const: false
          description: Phase 1 hard-off；启用需独立立项与 /v2。
        autofill_adapter:
          type: boolean
        llm_ranker:
          type: boolean
        metrics_experimental_kpi:
          type: boolean
        auth_mode:
          $ref: '#/components/schemas/AuthMode'
    PolicyFlagUpdateRequest:
      oneOf:
        - $ref: '#/components/schemas/MutablePolicyFlagUpdateRequest'
        - $ref: '#/components/schemas/HardOffPolicyFlagUpdateRequest'
      discriminator:
        propertyName: flag_key
        mapping:
          rewrite: '#/components/schemas/HardOffPolicyFlagUpdateRequest'
          auto_send: '#/components/schemas/HardOffPolicyFlagUpdateRequest'
          autofill_adapter: '#/components/schemas/MutablePolicyFlagUpdateRequest'
          llm_ranker: '#/components/schemas/MutablePolicyFlagUpdateRequest'
          metrics_experimental_kpi: '#/components/schemas/MutablePolicyFlagUpdateRequest'
      description: |
        hard-off 分支允许表达 flag_value=true 请求，以便合同明确该请求的 403
        POLICY_DENIED 响应；允许通过语法校验不代表允许持久化。
    MutablePolicyFlagUpdateRequest:
      type: object
      required: [flag_key, flag_value, adr_id]
      properties:
        flag_key:
          $ref: '#/components/schemas/MutablePolicyFlagKey'
        flag_value:
          type: boolean
        adr_id:
          type:
            - string
            - 'null'
          pattern: '^ADR-[A-Za-z0-9._-]+$'
    HardOffPolicyFlagUpdateRequest:
      type: object
      required: [flag_key, flag_value, adr_id]
      x-phase1-denied-when:
        flag_value: true
        responseStatus: 403
        errorCode: POLICY_DENIED
      properties:
        flag_key:
          $ref: '#/components/schemas/Phase1HardOffPolicyFlagKey'
        flag_value:
          type: boolean
          description: false 可保持 hard-off；true 必须返回 403，且不得写库。
        adr_id:
          type:
            - string
            - 'null'
          pattern: '^ADR-[A-Za-z0-9._-]+$'
    PolicyFlagUpdateResponse:
      type: object
      required: [ok, flag_key, flag_value]
      properties:
        ok:
          const: true
        flag_key:
          $ref: '#/components/schemas/PolicyFlagKey'
        flag_value:
          type: boolean
