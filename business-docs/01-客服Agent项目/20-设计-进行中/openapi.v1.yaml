openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: CS-AI-C11 Customer Service Agent API
  version: 1.11.0
  license:
    name: Proprietary - internal use only
    identifier: LicenseRef-Proprietary
  summary: 客服 Agent 一期 HTTP API 的机器可校验合同
  description: |
    本合同将《39-API合同与发布状态机-v1.md》中一期客户端可调用的 `/v1` 路由固化为
    OpenAPI 3.1。生产请求使用飞书会话 Bearer token；开发环境可使用成对的
    `X-Mock-User` 与 `X-Mock-Role` 请求头。生产环境不得注册 mock-login 路由。

    一期策略边界：`rewrite=false`、`auto_send=false`。尝试将其中任一开关设为
    `true` 必须返回 403 `POLICY_DENIED`；publish、rollback、policy flags 仅 Owner
    可写。业务工单分析使用 `work_order_*` / `/v1/work-orders/*`；内部话术优化待办
    使用 `iteration_task*` / `/v1/*/iteration-tasks/*`，禁止 `/tickets` 与跨域原始明细。
    一期不暴露在线人工复核、训练、数据集、teacher 或蒸馏 API；这些能力只允许在数据门后
    通过受控离线 artifact 处理，不能从本合同推导出运行时权限。
    `native_integration` 仅作未来枚举保留；Phase 1 请求声明该来源必须 403
    `POLICY_DENIED` 且 query/impression/event 零写入，客户端不得自行声明原生可信来源。
    CR-004 要求每个 current release 恰好绑定 presale/campaign/aftersale/product 四个
    不可变 canonical source version。导入、发布、回滚、搜索与快照读取均 fail-closed；
    `source_ref` 只允许安全 `SRC-*` 别名，内部 URL、token 与对象定位符不得出现在响应。
    DEC-042 把每条发布内容固定为治理快照：显式平台/商品范围、生效时间、版本化意图、
    稳定 Question 身份、风险双审与受控占位符共同参与 `content_hash`。结构/安全/来源错误
    整批失败；行质量问题进入 quarantined，只有服务端冻结抽样计划、写入质量证据并判定
    通过后，`clean + quality_gate_passed` 才可发布。普通导入 worker 不得自报审核主体、审核
    结论或质量门结论；这些字段只从受限服务端证据派生。
    模板占位符值只在客户端内存渲染，不是任何请求、响应或事件的可存储字段。
    所有公开响应 handler 必须使用显式字段白名单 mapper 构造 wire object；
    禁止将 DB row、ORM entity 或内部对象通过 spread/整体序列化进入响应。

    当前文件仅是 Gate 3 实现设计与静态机器合同；Ddev 仍为空，尚未实现运行时
    handler，也没有不可变迁移、N/N-1、应用 runtime、托管 PostgreSQL 或客户端运行证据。
    当前 schema reference DDL 的本机隔离 PG15 前置结果不替代上述证据；本次版本号不表示已上线或已发布。
    破坏性变更必须进入 `/v2`。
  x-source-document: 39-API合同与发布状态机-v1.md
  x-phase: Phase1
  x-stable-details-reason-schema: '#/components/schemas/SourceContractReason'
  x-source-denial-audit:
    storage: source_denial_audits
    coreStorageFunction: record_source_denial_audit
    runtimeFunction: record_runtime_source_denial_audit
    adminFunction: record_admin_source_denial_audit
    allowedOperations:
      - content_import
      - content_publish
      - content_rollback
      - search
      - announce_current
      - announce_snapshot
      - source_suspend
    applies-to-reasons:
      - SOURCE_NOT_REGISTERED
      - SOURCE_NOT_ELIGIBLE
      - SOURCE_SUSPENDED
      - SOURCE_DOMAIN_MISMATCH
      - SOURCE_SNAPSHOT_MISMATCH
      - SOURCE_SET_INCOMPLETE
      - SOURCE_BASE_RELEASE_STALE
      - SOURCE_BINDING_HASH_MISMATCH
      - SOURCE_GATE_NOT_READY
      - OFFLINE_LEASE_INVALID
      - OFFLINE_LEASE_EXPIRED
      - OFFLINE_LEASE_BINDING_MISMATCH
    non-allowlisted-reason-audit: standard-controlled-change-or-error-audit
    never-write-reasons:
      - CONTENT_CONTRACT_INVALID
      - GOVERNANCE_HASH_MISMATCH
      - QUALITY_GATE_NOT_PASSED
    transaction: independent-after-rollback
    commitBeforeHttpResponse: true
    idempotencyKey: HMAC(operation|request-id|reason-code)
    safeFields:
      - denial_key
      - operation
      - reason_code
      - actor_subject_hash
      - hash_key_version
      - actor_role
      - release_id
      - source_version_id
      - source_binding_hash
      - diagnostic_id
    forbiddenFields: [query_text, source_ref, internal_url, token, stack_trace]
    description: |
      先回滚被拒业务事务，再用新连接/新事务调用对应 workload 包装函数并 commit，最后才返回
      HTTP denial。禁止在注定回滚的主事务中写审计；同 denial_key 异体必须 409。
      `record_source_denial_audit` 仅是内部存储 writer，不授予应用角色；
      content_import/search/current/snapshot 只能调用 `record_runtime_source_denial_audit`，
      publish/rollback/source_suspend 只能调用 `record_admin_source_denial_audit`。
      仅当 operation 与 reason 同时命中上述 SQL 白名单，且端点
      `x-rejection-audit.applies-to-reasons` 显式包含该 reason 时，
      `x-source-denial-audit-required: true` 才要求写 `source_denial_audits`。
      任何白名单外 reason（尤其 CONTENT_CONTRACT_INVALID、
      GOVERNANCE_HASH_MISMATCH、QUALITY_GATE_NOT_PASSED）只走标准受控
      change/error audit，不得写入 source_denial_audits。
  x-offline-snapshot-lease:
    storage: snapshot_offline_leases
    issueFunction: issue_snapshot_offline_lease
    validateFunction: validate_snapshot_offline_lease
    ttlSeconds: { default: 600, minimum: 60, maximum: 900 }
    binding: [client_id, user_id, release_id, source_binding_hash]
    tokenStorage: sha256-only
    ackRenewsLease: false
    expiredBehavior: fail-closed
  x-content-governance:
    decision: DEC-042
    executionClosure: schema.v1.12
    hash: SHA-256(JCS(normalized-governance-snapshot))
    timestampCanonicalization: UTC fixed-width microseconds with Z
    scopedSearchDbFunction: search_recommendable_scripts(platform, product_context_type, product_context_ref)
    runtimeDirectSelectBackingViews: false
    allowedPlaceholderKeys: [order_id, date]
    placeholderValuesPersisted: false
    questionIdentity:
      primaryKey: [question_id, question_version]
      hashFunction: content_question_hash
      originFingerprint: HMAC with origin_fingerprint_key_version
      taxonomyBinding: [intent_taxonomy_version, intent_id]
      historyOverwriteAllowed: false
    riskCategories:
      - refund_compensation
      - price_discount
      - campaign_rules
      - efficacy_safety_claim
      - account_privacy
      - complaint_escalation
      - legal_commitment
    dualReview:
      requiredWhen: risk_level=high OR has_conflict=true
      primaryRole: ROLE-CONTENT-LEAD
      secondaryRole: ROLE-CS-MANAGER
      sameReviewerForbidden: true
      storage: content_review_decisions
      recordFunction: record_content_review_decision
      reviewerSubjectInPublicResponse: false
    qualityReview:
      planStorage: content_quality_review_plans
      evidenceStorage: content_quality_review_evidence
      freezePlanFunction: freeze_content_quality_review_plan
      recordEvidenceFunction: record_content_quality_review_evidence
      thresholds:
        upTo500: full-review
        over500Initial: 10-percent-min100-max300
        expandWhenDefectRate: greater-than-2-percent-up-to-5-percent
        expandedSample: 30-percent
        blockWhenDefectRate: greater-than-5-percent
        highRiskOrConflict: full-review
    normalImportWorkerMayAssertReviewDecision: false
    normalImportWorkerMayAssertQualityConclusion: false
    batchFatalClasses: [structure, security, source]
    publishableQuality: { status: clean, qualityGatePassed: true }
  x-public-wire-mapping:
    mode: explicit-field-allowlist
    db-row-spread: forbidden
    internal-object-spread: forbidden
  x-runtime-status:
    implementation: not-started
    ddev: empty
    true-postgresql-evidence: not-certified
    n-n-minus-1-evidence: not-certified
  x-http-json-body-max-bytes: 32768
  x-phase1-invariants:
    rewrite: false
    auto_send: false
    onlineReviewApi: false
    publicTrainingApi: false
    nativePlatformIntegration: false
    ownerOnlyWrites:
      - POST /v1/content/publish
      - POST /v1/content/rollback
      - POST /v1/policy/flags
servers:
  - url: /
    description: 与当前 Web/Electron 客户端同源的 API 根路径
tags:
  - name: auth
    description: 会话身份与非生产 mock 登录
  - name: search
    description: 固定当前发布快照的客服话术搜索
  - name: events
    description: 查询操作的唯一 terminal 结果与辅助升级动作；不采集聊天记录或最终消息正文
  - name: notices
    description: 首次明确告知版本与当前用户决定
  - name: metrics
    description: 自动搜索复制事实的根问题/操作双口径、事件流及内部话术优化待办
  - name: work-orders
    description: 批准的业务工单导出文件只读分析；不含源系统写回
  - name: content
    description: 内容导入、发布与回滚
  - name: announce
    description: 当前发布公告、快照同步与 ACK
  - name: policy
    description: 一期策略读取与受控写入
  - name: platform
    description: 编排器存活与就绪探针，不计入九业务端口
security:
  - bearerAuth: []
  - mockUser: []
    mockRole: []
paths:
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: 进程存活探针
      description: 不访问 DB 或外部依赖，不返回环境变量或依赖细节。
      security: []
      responses:
        '200':
          description: 进程 event loop 可响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /ready:
    get:
      tags: [platform]
      operationId: getReadiness
      summary: 业务就绪探针
      description: |
        检查 DB、schema/migration、生产 auth 配置、import storage 写入/按 key/hash/size
        重读完整性与首发内容就绪。
        可选 ranker 失败不得拉低 readiness；响应不得含密钥、DSN 或异常文本。
      security: []
      responses:
        '200':
          description: 所有必要检查已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: 至少一项必要检查未就绪
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'

  /v1/auth/mock-login:
    post:
      tags: [auth]
      operationId: mockLogin
      summary: 创建非生产 mock 会话
      description: |
        仅允许在非生产且 `AUTH_MODE=mock` 时注册。生产环境若仍注册本路由，
        进程必须在监听端口前退出。
      security: []
      x-environments: [development, test]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockLoginRequest'
            examples:
              agent:
                value:
                  user_id: u-agent-001
                  role: agent
      responses:
        '200':
          description: Mock 会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockLoginResponse'
              examples:
                success:
                  value:
                    token: dev-token-example
                    user:
                      user_id: u-agent-001
                      role: agent
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Overloaded'

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: 获取当前已验签身份
      responses:
        '200':
          description: 当前用户与鉴权模式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              examples:
                feishuOwner:
                  value:
                    user_id: ou_8f5c2a
                    role: owner
                    auth_mode: feishu
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Overloaded'

  /v1/notices/current:
    get:
      tags: [notices]
      operationId: getCurrentPrivacyNotice
      summary: 获取当前明确告知版本与本用户决定
      description: |
        返回唯一 `status=current` 的 notice，以及当前 token 用户对该版本的首次决定。
        decision 为 null 时，客户端必须展示一次明确告知；不得把页面浏览等同于接受。
      x-required-roles: [agent, coach, owner]
      responses:
        '200':
          description: 当前告知版本与用户决定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentNoticeResponse'
              examples:
                undecided:
                  value:
                    notice:
                      version: notice-2026-08-v1
                      content: 采集脱敏后的搜索原话与成功复制的话术，用于改进知识库；不采集聊天记录或最终发送正文。
                      content_hash: 1c8aa5ac59a9ce0f2e79cac6801e36b9c8f8f127067b525e69b7e88b0303db99
                      published_at: '2026-08-08T00:00:00Z'
                    decision: null
                    decided_at: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Overloaded'

  /v1/notices/{version}/decision:
    post:
      tags: [notices]
      operationId: recordPrivacyNoticeDecision
      summary: 记录当前用户对明确告知版本的首次决定
      description: |
        只接受当前 notice version。服务端从 token 写 user_id；同一 user/version 只保留
        第一条决定。同幂等键重放首次终态；同版本已存在不同决定返回 409，禁止覆盖审计证据。
      x-required-roles: [agent, coach, owner]
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeDecisionRequest'
            examples:
              accept:
                value:
                  decision: accepted
      responses:
        '200':
          description: 决定已记录或幂等重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeDecisionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrPolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Overloaded'

  /v1/search:
    post:
      tags: [search]
      operationId: searchScripts
      summary: 在当前 release snapshot 中搜索客服话术
      x-http-json-body-max-bytes: 32768
      description: |
        `query_id` 是本路由的幂等键。相同 user/query_id/body 的终态请求重放首次
        响应；同 query_id 异体返回 409。redaction 失败时 fail-closed，不记录原文、
        不调用 ranker，并返回 500。`rewrite=false` 时 `answer_text` 必须字节级等于
        当前 release item 的正文。`collection_mode=pilot_recorded` 时服务端必须确认当前
        notice version 已被当前用户接受；未接受或 notice 校验不可用时 fail-closed。
        仅 telemetry 写入故障且 auth、DLP、当前内容与检索仍健康时，可返回
        `telemetry_status=collection_disabled` 的无状态结果；该路径不得写 query/impression，
        不接受后续 adoption/escalate，并自动排除所有指标。DLP/Auth/content 失败不得降级。
        在线召回主路固定为 PostgreSQL 字符 bigram + normalize + exact/ILIKE 回退；候选必须
        原样绑定本次 release item 的 release_id/script_id/script_version/content_hash。
        `platform_source=native_integration` 是未来保留值；Phase 1 必须返回 403
        `POLICY_DENIED` 且不写 query/impression/event。
        服务端必须先验证 current release 的四域 source gate；集合缺失、哈希不一致或任一
        source 已暂停时返回 503 `SOURCE_GATE_NOT_READY`，且 query/impression/event 零写入。
        同时必须调用与 SQL `content_scope_matches` 同义的过滤：平台必须显式命中
        `platform_scope`；storewide 内容可在无商品上下文时命中，category/sku 内容必须分别
        收到同类型 `product_context_type + product_context_ref` 精确命中。禁止把 category 当 sku 或猜测范围。
        handler 必须使用 `SearchResponse`/`SearchCandidate` 白名单显式映射；
        禁止 spread DB row 或重用内部审核/来源对象。
      x-required-roles: [agent, coach, owner]
      x-search-strategy: postgres-character-bigram-primary
      x-rejection-audit:
        operation: search
        storage: source_denial_audits
        function: record_runtime_source_denial_audit
        applies-to-reasons: [SOURCE_GATE_NOT_READY]
      x-source-denial-audit-required: true
      x-search-telemetry-transaction:
        mode: atomic
        writes: [query_events, candidate_impressions]
        rollbackOn: [SOURCE_GATE_NOT_READY]
      x-error-reasons:
        '503': [SOURCE_GATE_NOT_READY]
      x-idempotency:
        key: body.query_id
        headerRequired: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              acceptedForegroundHint:
                value:
                  query_id: 4d690ef7-a98d-4a56-a9c4-92ae4c52168f
                  parent_query_id: null
                  interaction_reason: original
                  query_text: 客户问这件衣服什么时候发货
                  collection_mode: pilot_recorded
                  detected_platform: qianniu
                  platform: qianniu
                  platform_source: foreground_process
                  product_context_type: sku
                  product_context_ref: sku-001
                  top_k: 3
      responses:
        '200':
          description: 搜索完成；无候选时 candidates 为空数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                hit:
                  value:
                    query_id: 4d690ef7-a98d-4a56-a9c4-92ae4c52168f
                    hit_status: hit
                    release_id: rel-20260806-0012
                    source_binding_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    telemetry_status: recorded
                    candidates:
                      - rank: 1
                        release_id: rel-20260806-0012
                        script_id: shipping-001
                        script_version: 3
                        content_hash: a98fc80eaeeecfd3aa57fbfece9a081ab675bc044ffaac7aecfac06aceadc5b0
                        title: 发货时效
                        category: presale
                        answer_text: 您好，订单将在付款后 48 小时内发出。
                        platform_scope: [qianniu, douyin]
                        product_scope_type: storewide
                        product_scope_refs: []
                        effective_from: '2026-08-10T00:00:00Z'
                        effective_to: null
                        intent_taxonomy_version: itax_2026_08_v1
                        intent_id: intent_shipping_eta
                        risk_level: low
                        risk_categories: []
                        has_conflict: false
                        placeholder_keys: []
                noHit:
                  value:
                    query_id: ce17d26f-456c-495d-aaba-7fdce87c6f91
                    hit_status: no_hit
                    release_id: rel-20260806-0012
                    source_binding_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    telemetry_status: recorded
                    candidates: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrPolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/events/adoption:
    post:
      tags: [events]
      operationId: recordAdoption
      summary: 记录当前用户的复制成功或退出结果（adoption 兼容名）
      description: |
        query 必须属于当前 token 用户。`adopted` 的冻结语义是候选已成功复制，不代表
