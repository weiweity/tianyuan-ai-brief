          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementAckRequest'
            examples:
              synced:
                value:
                  client_id: mac-cs-001
                  release_id: rel-20260806-0013
                  release_seq: 13
                  offline_lease_token: osl_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      responses:
        '200':
          description: 同步游标已写入，或旧 ACK 被安全忽略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              examples:
                success:
                  value:
                    ok: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrPolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Overloaded'

  /v1/policy:
    get:
      tags: [policy]
      operationId: getPolicy
      summary: 获取一期策略与只读鉴权模式
      description: 未知 flag 读取按最严 OFF；auth_mode 只来自部署配置，不属于 policy_flags。
      responses:
        '200':
          description: 当前策略；一期 rewrite 与 auto_send 恒为 false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
              examples:
                phase1:
                  value:
                    rewrite: false
                    auto_send: false
                    autofill_adapter: false
                    llm_ranker: false
                    metrics_experimental_kpi: false
                    auth_mode: feishu
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Overloaded'

  /v1/policy/flags:
    post:
      tags: [policy]
      operationId: setPolicyFlag
      summary: 通过唯一受控入口写策略开关
      description: |
        一期仅 Owner，且服务端必须调用 set_policy_flag。rewrite=true 或 auto_send=true
        即使带 ADR 也必须返回 403 POLICY_DENIED；mock_auth 与未知 key 返回 400。
      x-required-roles: [owner]
      x-phase1-owner-only: true
      x-phase1-hard-off:
        flags: [rewrite, auto_send]
        deniedValue: true
        responseStatus: 403
        errorCode: POLICY_DENIED
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyFlagUpdateRequest'
            examples:
              enableRanker:
                value:
                  flag_key: llm_ranker
                  flag_value: true
                  adr_id: ADR-012
              hardOffRewrite:
                summary: 语法有效，但一期必须以 403 POLICY_DENIED 拒绝
                value:
                  flag_key: rewrite
                  flag_value: true
                  adr_id: ADR-099
      responses:
        '200':
          description: 可写策略已更新，或 hard-off 开关保持 false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyFlagUpdateResponse'
              examples:
                success:
                  value:
                    ok: true
                    flag_key: llm_ranker
                    flag_value: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrPolicyDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Overloaded'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Feishu session
      description: |
        生产唯一鉴权方案。服务端必须验签并从 claims 取得 user_id 与 role；不得信任
        业务请求体中的身份字段。
    mockUser:
      type: apiKey
      in: header
      name: X-Mock-User
      description: 仅 development/test 且 AUTH_MODE=mock；必须与 X-Mock-Role 同时出现。
    mockRole:
      type: apiKey
      in: header
      name: X-Mock-Role
      description: 仅 development/test，值为 agent、coach 或 owner；请求日志必须标记 AUTH_MOCK。

  parameters:
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        同 scope/key/body 重放首次终态响应；同键异体或处理中返回 409。建议 UUID。
        终态 TTL 至少 24 小时。
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 5a5d8ff9-a23e-4c04-b902-64d0e33502cf
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 提供时按共用幂等状态机处理；本路由在 39 合同中未列为强制携带。
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 68cc44fb-3d14-4860-a765-e882754d66d7
    ImportBatchId:
      name: import_batch_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: imp-01J4PF9TQX7G
    IterationTaskId:
      name: task_id
      in: path
      required: true
      description: 内部话术优化待办 ID；不得填业务工单 ID。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: itask-01J4PF9TQX7G
    IterationTaskStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/IterationTaskStatus'
    IterationTaskSignalFilter:
      name: signal_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IterationTaskAssigneeFilter:
      name: assignee_role
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderImportBatchId:
      name: import_batch_id
      in: path
      required: true
      description: 业务工单分析导入批次 ID。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: woimp-01J4PF9TQX7G
    WorkOrderFrom:
      name: from
      in: query
      required: true
      description: 业务记录时间窗起点；与 to 构成半开区间，最大 31 天。
      schema:
        type: string
        format: date-time
      example: '2026-07-01T00:00:00Z'
    WorkOrderTo:
      name: to
      in: query
      required: true
      description: 业务记录时间窗终点；必须晚于 from，差值不超过 31 天。
      schema:
        type: string
        format: date-time
      example: '2026-08-01T00:00:00Z'
    WorkOrderImportBatchFilter:
      name: import_batch_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderChannelFilter:
      name: channel
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderCategoryFilter:
      name: category
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderIssueTypeFilter:
      name: issue_type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderErrorTypeFilter:
      name: error_type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkOrderEscalatedFilter:
      name: escalated
      in: query
      required: false
      schema:
        type: boolean
    WorkOrderLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    WorkOrderCursor:
      name: cursor
      in: query
      required: false
      description: 不透明、稳定倒序的业务工单明细游标。
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    MetricsFrom:
      name: from
      in: query
      required: true
      description: 查询窗起点，ISO-8601 UTC；必须满足 to > from 且 to - from 不超过 7 天，否则返回 400 VALIDATION。
      schema:
        type: string
        format: date-time
      example: '2026-07-31T00:00:00Z'
    MetricsTo:
      name: to
      in: query
      required: true
      description: 查询窗终点，ISO-8601 UTC；必须晚于 from，且与 from 的差不超过 7 天，否则返回 400 VALIDATION。
      schema:
        type: string
        format: date-time
      example: '2026-08-06T23:59:59Z'
    MetricsUserId:
      name: user_id
      in: query
      required: false
      description: 可选的用户过滤条件，仍受调用者授权范围约束。
      schema:
        type: string
        minLength: 1
      example: u-agent-001
    MetricsPlatform:
      name: platform
      in: query
      required: false
      description: 按用户已确认的 canonical 平台过滤。
      schema:
        type: string
        enum: [qianniu, douyin, unknown]
    MetricsHitStatus:
      name: hit_status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/HitStatus'
    MetricsChosenRank:
      name: chosen_rank
      in: query
      required: false
      description: 按成功复制的候选位次过滤。
      schema:
        type: integer
        minimum: 1
        maximum: 3
    MetricsReleaseId:
      name: release_id
      in: query
      required: false
      description: 按搜索当时的不可变内容 release 过滤。
      schema:
        type: string
        minLength: 1
    StreamLimit:
      name: limit
      in: query
      required: false
      description: 每页条目数。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    MetricsCursor:
      name: cursor
      in: query
      required: false
      description: 不透明 base64url cursor；内部为 created_at 与 query_id 的稳定倒序游标。
      schema:
        type: string
        minLength: 1
      example: MjAyNi0wOC0wNlQwMzoxNDoxNVp8NGQ2OTBlZjctYTk4ZC00YTU2LWE5YzQtOTJhZTRjNTIxNjhm
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 上次 current 响应的弱 ETag；命中时返回 304。
      schema:
        type: string
      example: 'W/"13"'
    SnapshotClientId:
      name: X-Client-Id
      in: header
      required: true
      description: 当前客户端稳定 ID；租约同时绑定验签用户，不得跨客户端复用。
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: mac-cs-001
    OptionalSnapshotLeaseToken:
      name: X-Snapshot-Lease
      in: header
      required: false
      description: |
        只用于 current 条件请求；仅当该 token 未过期且绑定同一 release/source hash
        时才允许 304，否则必须返回 200 并签发新短租约。
      schema:
        $ref: '#/components/schemas/OfflineSnapshotLeaseToken'
    RequiredSnapshotLeaseToken:
      name: X-Snapshot-Lease
      in: header
      required: true
      description: current 签发的不透明短租约；每一页都必须重新验证绑定与过期时间。
      schema:
        $ref: '#/components/schemas/OfflineSnapshotLeaseToken'
    ReleaseIdQuery:
      name: release_id
      in: query
      required: true
      description: 从 current 响应复制；同一次分页全过程不得省略或切换。
      schema:
        type: string
        minLength: 1
      example: rel-20260806-0013
    SnapshotLimit:
      name: limit
      in: query
      required: false
      description: 每页话术数。
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
      example: 200
    SnapshotCursor:
      name: cursor
      in: query
      required: false
      description: 上一页最后一个 script_id；服务端按 script_id 升序继续。
      schema:
        type: string
        minLength: 1
      example: shipping-001

  headers:
    RetryAfter:
      description: 客户端重试前至少等待的秒数，最少为 1。
      schema:
        type: integer
        minimum: 1
      example: 1
    ETag:
      description: 由 release_seq 构成的弱 ETag。
      schema:
        type: string
        pattern: '^W/"[0-9]+"$'
      example: 'W/"13"'
    CacheControl:
      description: current 可缓存不超过 10 秒。
      schema:
        type: string
      example: max-age=10
    SnapshotLease:
      description: 304 仅回显请求中仍有效的原租约，不签发、不续期。
      schema:
        $ref: '#/components/schemas/OfflineSnapshotLeaseToken'
    SnapshotLeaseExpires:
      description: 原租约的固定过期时间；304 不得延长。
      schema:
        type: string
        format: date-time

  responses:
    ValidationError:
      description: 请求结构、字段或业务对应关系无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION
                  message: 请求参数不合法
                  details:
                    field: top_k
                    reason: must be between 1 and 3
    Unauthorized:
      description: 缺少或无法验证会话
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedErrorEnvelope'
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: 会话无效或已过期
    Forbidden:
      description: 当前已验签身份无权访问该资源或动作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenErrorEnvelope'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: 当前角色无权执行此操作
    ForbiddenOrPolicyDenied:
      description: 当前身份越权，或动作违反一期策略
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenOrPolicyDeniedErrorEnvelope'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: 当前身份无权访问该资源或执行此操作
            adoptionPolicyDenied:
              value:
                error:
                  code: POLICY_DENIED
                  message: adopted 只能通过 clipboard 或 autofill 完成
            phase1HardOff:
              value:
                error:
                  code: POLICY_DENIED
                  message: Phase 1 禁止启用 rewrite
                  details:
                    reason: PHASE1_HARD_OFF
                    flag_key: rewrite
                    requested_value: true
            nativeIntegrationDisabled:
              value:
                error:
                  code: POLICY_DENIED
                  message: Phase 1 未启用原生平台集成
                  details:
                    reason: NATIVE_INTEGRATION_DISABLED
                    platform_source: native_integration
            sourceSuspended:
              value:
                error:
                  code: POLICY_DENIED
                  message: 权威来源版本已暂停
                  details:
                    reason: SOURCE_SUSPENDED
                    source_version_id: srcv_presale_2026_08_09_01
            offlineLeaseExpired:
              value:
                error:
                  code: FORBIDDEN
                  message: 离线快照租约已过期，请联网刷新
                  details:
                    reason: OFFLINE_LEASE_EXPIRED
                    diagnostic_id: diag_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    NotFound:
      description: 指定资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundErrorEnvelope'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: 指定资源不存在
    Conflict:
      description: 幂等键、状态机、发布锁或资源当前状态发生冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictErrorEnvelope'
          examples:
            idempotencyBodyMismatch:
              value:
                error:
                  code: CONFLICT
                  message: 幂等键已用于不同请求体
                  details:
                    reason: IDEMPOTENCY_BODY_MISMATCH
            inFlight:
              value:
                error:
                  code: CONFLICT
                  message: 同一幂等请求仍在处理中
                  details:
                    reason: IDEMPOTENCY_IN_FLIGHT
            sourceBaseReleaseStale:
              value:
                error:
                  code: CONFLICT
                  message: 导入基线已不是当前发布版本
                  details:
                    reason: SOURCE_BASE_RELEASE_STALE
    TooManyRequests:
      description: 令牌桶拒绝当前请求
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedErrorEnvelope'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: 请求过于频繁，请稍后重试
                  details:
                    retry_after_sec: 2
    Overloaded:
      description: 连接池、并发槽或依赖存储暂时过载；生产限流存储故障也 fail-closed 到此响应
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OverloadedErrorEnvelope'
          examples:
            overloaded:
              value:
                error:
                  code: OVERLOADED
                  message: 服务暂时过载
                  details:
                    retry_after_sec: 1
    ServiceUnavailable:
      description: 路由或依赖过载，或 Owner 尚未完成首次内容发布
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OverloadedErrorEnvelope'
              - $ref: '#/components/schemas/ContentNotReadyErrorEnvelope'
          examples:
            overloaded:
              value:
                error:
                  code: OVERLOADED
                  message: 服务暂时过载
                  details:
                    reason: DB_POOL_EXHAUSTED
                    retry_after_sec: 1
            firstReleasePending:
              value:
                error:
                  code: OVERLOADED
                  message: 内容尚未发布
                  details:
                    reason: CONTENT_NOT_READY
                    retry_after_sec: 1
            sourceGateNotReady:
              value:
                error:
                  code: OVERLOADED
                  message: 当前内容来源校验未通过
                  details:
                    reason: SOURCE_GATE_NOT_READY
                    retry_after_sec: 1
    InternalError:
      description: 未归类的服务端错误；不得泄露原始查询或内部堆栈
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL
                  message: 服务内部错误

  schemas:
    Role:
      type: string
      enum: [agent, coach, owner]
      description: 只允许来自服务端验签后的会话 claims。
    AuthMode:
      type: string
      enum: [mock, feishu]
    ErrorCode:
      type: string
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - VALIDATION
        - NOT_FOUND
        - CONFLICT
        - POLICY_DENIED
        - RATE_LIMITED
        - OVERLOADED
        - INTERNAL
    SourceContractReason:
      type: string
      description: |
        来源、租约与内容治理的稳定拒绝原因，必须放在 `error.details.reason`；
        客户端不得解析 message 文本。只有 `info.x-source-denial-audit.applies-to-reasons`
        白名单中的值才能写入 source_denial_audits。
      enum:
        - SOURCE_NOT_REGISTERED
        - SOURCE_NOT_ELIGIBLE
        - SOURCE_SUSPENDED
        - SOURCE_DOMAIN_MISMATCH
        - SOURCE_SNAPSHOT_MISMATCH
        - SOURCE_SET_INCOMPLETE
        - SOURCE_BASE_RELEASE_STALE
        - SOURCE_BINDING_HASH_MISMATCH
        - SOURCE_GATE_NOT_READY
        - SOURCE_HISTORY_IMMUTABLE
        - OFFLINE_LEASE_INVALID
        - OFFLINE_LEASE_EXPIRED
        - OFFLINE_LEASE_BINDING_MISMATCH
        - CONTENT_CONTRACT_INVALID
        - GOVERNANCE_HASH_MISMATCH
        - QUALITY_GATE_NOT_PASSED
        - QUESTION_IDENTITY_CONFLICT
        - PHASE1_HARD_OFF
        - NATIVE_INTEGRATION_DISABLED
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          const: ok
        service:
          const: cs-ai-api
        version:
          type: string
          minLength: 1
    ReadyCheckStatus:
      type: string
      enum: [ok, not_ready]
    ReadyChecks:
      type: object
      additionalProperties: false
      required: [database, schema, auth, storage, content]
      properties:
        database:
          $ref: '#/components/schemas/ReadyCheckStatus'
        schema:
          $ref: '#/components/schemas/ReadyCheckStatus'
        auth:
          $ref: '#/components/schemas/ReadyCheckStatus'
        storage:
          $ref: '#/components/schemas/ReadyCheckStatus'
        content:
          $ref: '#/components/schemas/ReadyCheckStatus'
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          const: ready
        checks:
          allOf:
            - $ref: '#/components/schemas/ReadyChecks'
            - properties:
                database: { const: ok }
                schema: { const: ok }
                auth: { const: ok }
                storage: { const: ok }
                content: { const: ok }
    NotReadyResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          const: not_ready
        checks:
          allOf:
            - $ref: '#/components/schemas/ReadyChecks'
            - anyOf:
                - properties: { database: { const: not_ready } }
                  required: [database]
                - properties: { schema: { const: not_ready } }
                  required: [schema]
                - properties: { auth: { const: not_ready } }
                  required: [auth]
                - properties: { storage: { const: not_ready } }
                  required: [storage]
                - properties: { content: { const: not_ready } }
                  required: [content]
    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: VALIDATION
            message: { type: string, minLength: 1 }
            details: { type: object, additionalProperties: true }
    UnauthorizedErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: UNAUTHORIZED
            message: { type: string, minLength: 1 }
            details: { type: object, additionalProperties: true }
    ForbiddenErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: FORBIDDEN
            message: { type: string, minLength: 1 }
            details: { type: object, additionalProperties: true }
    ForbiddenOrPolicyDeniedErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - enum: [FORBIDDEN, POLICY_DENIED]
            message: { type: string, minLength: 1 }
            details:
              type: object
              properties:
                reason:
                  $ref: '#/components/schemas/SourceContractReason'
              additionalProperties: true
    NotFoundErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: NOT_FOUND
            message: { type: string, minLength: 1 }
            details: { type: object, additionalProperties: true }
    ConflictErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: CONFLICT
            message: { type: string, minLength: 1 }
            details: { type: object, additionalProperties: true }
    RateLimitedErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: RATE_LIMITED
            message: { type: string, minLength: 1 }
            details: { type: object, additionalProperties: true }
    OverloadedErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: OVERLOADED
            message: { type: string, minLength: 1 }
            details:
              type: object
              properties:
                reason:
                  enum:
                    - DB_POOL_EXHAUSTED
                    - CONCURRENCY_LIMIT
                    - RATE_LIMIT_STORAGE_UNAVAILABLE
                    - STORAGE_UNAVAILABLE
                    - SOURCE_GATE_NOT_READY
              additionalProperties: true
    ContentNotReadyErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: OVERLOADED
            message: { type: string, minLength: 1 }
            details:
              type: object
              required: [reason]
              properties:
                reason: { const: CONTENT_NOT_READY }
              additionalProperties: true
    InternalErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              allOf:
                - $ref: '#/components/schemas/ErrorCode'
                - const: INTERNAL
            message: { type: string, minLength: 1 }
            details: { type: object, additionalProperties: true }
    UserClaims:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
    MockLoginRequest:
      allOf:
        - $ref: '#/components/schemas/UserClaims'
    MockLoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          minLength: 1
        user:
          $ref: '#/components/schemas/UserClaims'
    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/UserClaims'
        - type: object
          required: [auth_mode]
          properties:
            auth_mode:
              $ref: '#/components/schemas/AuthMode'

    NoticeDecision:
      type: string
      enum: [accepted, declined]
    PrivacyNotice:
      type: object
      required: [version, content, content_hash, published_at]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 128
        content:
          type: string
          minLength: 1
          maxLength: 10000
        content_hash:
          $ref: '#/components/schemas/ContentHash'
        published_at:
          type: string
          format: date-time
    CurrentNoticeResponse:
      type: object
      required: [notice, decision, decided_at]
      properties:
        notice:
          $ref: '#/components/schemas/PrivacyNotice'
        decision:
          oneOf:
            - $ref: '#/components/schemas/NoticeDecision'
            - type: 'null'
        decided_at:
          type:
            - string
            - 'null'
          format: date-time
    NoticeDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/NoticeDecision'
    NoticeDecisionResponse:
      type: object
      required: [ok, version, decision, decided_at]
      properties:
        ok:
          const: true
        version:
          type: string
          minLength: 1
          maxLength: 128
        decision:
          $ref: '#/components/schemas/NoticeDecision'
        decided_at:
          type: string
          format: date-time

    Platform:
      type:
        - string
        - 'null'
      enum: [qianniu, douyin, unknown, null]
      description: 已确认的规范平台；无法确认时显式 unknown 或 null。
    CollectionMode:
      type: string
      enum: [synthetic, approved_redacted, pilot_recorded]
      description: |
        数据来源授权模式。pilot_recorded 需要服务端验证当前用户已接受 current notice；
        该校验依赖服务端状态，不能只靠 JSON Schema。
    PlatformSource:
      type: string
      enum: [manual, foreground_process, native_integration, unknown]
      x-phase1-denied-values: [native_integration]
      description: |
        Phase 1 的 platform 仍必须经用户确认。manual=直接选择或修正；
        foreground_process=用户接受本次唤起时的一次性进程提示，此时必须
        detected_platform=platform；native_integration 为未来预留，Phase 1 请求该值
        必须 403 POLICY_DENIED 且零写入；unknown 时 platform 只能为 unknown/null。
        禁止将该字段解释为全局监控、未确认真值或客户端自证的原生来源。
    InteractionReason:
      type: string
      enum: [original, reselection]
      description: original=一个根问题的首次搜索；reselection=父操作 terminal 后的再次选择/搜索。
    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - query_id
        - parent_query_id
        - interaction_reason
        - query_text
        - collection_mode
        - detected_platform
        - platform
        - platform_source
        - product_context_type
        - product_context_ref
        - top_k
      properties:
        query_id:
          type: string
          format: uuid
          description: 当前用户在本路由的幂等键。
        parent_query_id:
          type: [string, 'null']
          format: uuid
          description: reselection 必须引用同一用户、已经写入 terminal adoption outcome 的父 query。
        interaction_reason:
          $ref: '#/components/schemas/InteractionReason'
        query_text:
          type: string
          minLength: 1
          maxLength: 500
          description: 原始输入按 Unicode code point 计 1..500；超限返回 400 VALIDATION。
        collection_mode:
          $ref: '#/components/schemas/CollectionMode'
        detected_platform:
          $ref: '#/components/schemas/Platform'
        platform:
          $ref: '#/components/schemas/Platform'
        platform_source:
          $ref: '#/components/schemas/PlatformSource'
        product_context_type:
          type: [string, 'null']
          enum: [category, sku, null]
          description: 商品上下文类型；不得用 sku 字段代替 category 范围。
        product_context_ref:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: 对应 category 或 sku 的规范引用；服务端只持久版本化 HMAC，不持久原值。
        top_k:
          type: integer
          minimum: 1
          maximum: 3
          default: 3
      oneOf:
        - title: original 根问题
          properties:
            interaction_reason:
              const: original
            parent_query_id:
              type: 'null'
        - title: reselection 后续操作
          properties:
            interaction_reason:
              const: reselection
            parent_query_id:
              type: string
              format: uuid
      allOf:
        - oneOf:
            - title: storewide 检索无商品上下文
              properties:
                product_context_type: { type: 'null' }
                product_context_ref: { type: 'null' }
            - title: category 精确上下文
              properties:
                product_context_type: { const: category }
                product_context_ref: { type: string, minLength: 1, maxLength: 128 }
            - title: sku 精确上下文
              properties:
                product_context_type: { const: sku }
                product_context_ref: { type: string, minLength: 1, maxLength: 128 }
    HitStatus:
      type: string
      enum: [hit, no_hit]
    ContentHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: |
        `SHA-256(JCS(normalized governance snapshot))` 的小写十六进制值，不再是 Answer 单字段 hash。
        Answer、Question 映射、scope、taxonomy、risk/review、有效期或 placeholder 任一变更均生成
        新 script_version 和新 content_hash。
    AuthoritativeSourceVersionId:
      type: string
      pattern: '^srcv_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'
      description: 已登记的不可变权威来源版本 ID；不得放入 URL、token 或路径。
    SafeSourceRef:
      type: string
      pattern: '^SRC-[A-Z0-9][A-Z0-9._-]{0,126}$'
      description: 可向客服与审计界面展示的稳定别名，不是内部资源定位符。
    SourceBindingHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: 按 domain 排序后对 `domain:source_version_id` 四域集合计算的 sha256。
    OfflineSnapshotLeaseToken:
      type: string
      pattern: '^osl_[0-9a-f]{64}$'
      description: |
        一次性签发的不透明 bearer token；服务端只存 sha256。不得写入日志、
        denial audit 或 source_ref，不得作为 URL 参数。
    OfflineSnapshotLease:
      type: object
      additionalProperties: false
      required: [token, expires_at, release_id, source_binding_hash]
      properties:
        token:
          $ref: '#/components/schemas/OfflineSnapshotLeaseToken'
        expires_at:
          type: string
          format: date-time
          description: |
            签发后 60..900 秒。客户端每次本地检索前都必须检查该时间；
            `now >= expires_at` 时必须立即停止本地搜索。
        release_id:
          type: string
          minLength: 1
        source_binding_hash:
          $ref: '#/components/schemas/SourceBindingHash'
      description: |
        token、release_id、source_binding_hash、expires_at 必须作为一个原子包保存和校验；
        任一字段缺失/不匹配或 `now >= expires_at` 都 fail-closed。
    AuthoritativeSourceBinding:
      type: object
      additionalProperties: false
      required: [domain, source_version_id]
      properties:
        domain:
          $ref: '#/components/schemas/ScriptCategory'
        source_version_id:
          $ref: '#/components/schemas/AuthoritativeSourceVersionId'
    AuthoritativeSourceBindingStatus:
      type: object
      additionalProperties: false
      required: [domain, source_version_id, source_ref]
      properties:
        domain:
          $ref: '#/components/schemas/ScriptCategory'
        source_version_id:
          $ref: '#/components/schemas/AuthoritativeSourceVersionId'
        source_ref:
          $ref: '#/components/schemas/SafeSourceRef'
    ScriptCategory:
      type: string
      enum: [presale, campaign, aftersale, product]
    PlatformScope:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        type: string
        enum: [qianniu, douyin]
      description: 必填且非空；两值同时存在表示 both，禁止 null/[] 表示全平台。
    ProductScopeType:
      type: string
      enum: [storewide, category, sku]
    ProductScopeRefs:
      type: array
      uniqueItems: true
      maxItems: 1000
      items:
        type: string
        minLength: 1
        maxLength: 128
      description: storewide 必须为 []；category/sku 必须非空。
    IntentTaxonomyVersion:
      type: string
      pattern: '^itax_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'
    IntentId:
      type: string
      pattern: '^intent_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'
    RiskLevel:
      type: string
      enum: [low, medium, high]
    RiskCategory:
      type: string
      enum:
        - refund_compensation
        - price_discount
        - campaign_rules
        - efficacy_safety_claim
        - account_privacy
        - complaint_escalation
        - legal_commitment
    RiskCategories:
      type: array
      uniqueItems: true
      maxItems: 7
      items:
        $ref: '#/components/schemas/RiskCategory'
      description: high 必须至少一类；low/medium 必须为空数组。
    ReviewMode:
      type: string
      enum: [single, dual]
    PlaceholderKey:
      type: string
      enum: [order_id, date]
    QuestionSource:
      type: string
      enum: [manual, from_log, import]
    ContentQuestion:
      type: object
      additionalProperties: false
      required:
        - question_id
        - question_version
        - question_text
        - question_hash
        - semantic_family_id
        - origin_fingerprint
        - origin_fingerprint_key_version
        - source_asset_id
        - source
        - intent_taxonomy_version
        - intent_id
      properties:
        question_id:
          type: string
          pattern: '^q_[A-Za-z0-9][A-Za-z0-9_-]{7,126}$'
          description: 上游给定的稳定随机 ID；禁止从行号、排序或数组下标派生。
        question_version: { type: integer, minimum: 1 }
        question_text: { type: string, minLength: 1, maxLength: 500 }
        question_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        semantic_family_id:
          type: string
          pattern: '^sf_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'
        origin_fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 版本化密钥计算的 HMAC 指纹；不是原始客户文本。
        origin_fingerprint_key_version:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: 计算 origin_fingerprint 的服务端 HMAC 密钥版本；不含密钥材料。
        source_asset_id:
          type: string
          pattern: '^sa_[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'
        source:
          $ref: '#/components/schemas/QuestionSource'
        intent_taxonomy_version:
          $ref: '#/components/schemas/IntentTaxonomyVersion'
        intent_id:
          $ref: '#/components/schemas/IntentId'
        source_query_id: { type: [string, 'null'], minLength: 1 }
        promotion_review_ref: { type: [string, 'null'], minLength: 1 }
        promoted_by_role: { type: [string, 'null'], minLength: 1 }
        promoted_at: { type: [string, 'null'], format: date-time }
      oneOf:
        - title: from_log 获批晋级
          properties:
            source: { const: from_log }
            source_query_id: { type: string, minLength: 1 }
            promotion_review_ref: { type: string, minLength: 1 }
            promoted_by_role: { type: string, minLength: 1 }
            promoted_at:
              type: string
              format: date-time
              pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
          required: [source_query_id, promotion_review_ref, promoted_by_role, promoted_at]
        - title: manual 或 import 原生语义资产
          properties:
            source: { enum: [manual, import] }
            source_query_id: { type: 'null' }
            promotion_review_ref: { type: 'null' }
            promoted_by_role: { type: 'null' }
            promoted_at: { type: 'null' }
    SearchCandidate:
      type: object
      additionalProperties: false
      description: |
        公开检索候选的封闭白名单投影。handler 必须逐字段构造，禁止
        DB row/internal object spread；不含审核证据、负责人或内部来源定位符。
      required:
        - rank
        - release_id
        - script_id
        - script_version
        - content_hash
        - title
        - category
        - answer_text
        - platform_scope
        - product_scope_type
        - product_scope_refs
        - effective_from
        - effective_to
        - intent_taxonomy_version
        - intent_id
        - risk_level
        - risk_categories
        - has_conflict
        - placeholder_keys
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 3
        release_id:
          type: string
          minLength: 1
          description: 与本候选不可变绑定的 release_items.release_id，必须等于响应顶层 release_id。
        script_id:
          type: string
          minLength: 1
        script_version:
          type: integer
          minimum: 1
        content_hash:
          $ref: '#/components/schemas/ContentHash'
        title:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/ScriptCategory'
        answer_text:
          type: string
          minLength: 1
          description: Phase 1 必须原样来自当前 release_items，不得改写。
        platform_scope:
          $ref: '#/components/schemas/PlatformScope'
        product_scope_type:
          $ref: '#/components/schemas/ProductScopeType'
        product_scope_refs:
          $ref: '#/components/schemas/ProductScopeRefs'
        effective_from:
          type: string
          format: date-time
          description: 包含下界；只有 `effective_from <= now` 才可推荐。
        effective_to:
          type:
            - string
            - 'null'
          format: date-time
          description: 排他上界；只有 `now < effective_to` 才可推荐，`now == effective_to` 必须排除。
        intent_taxonomy_version:
          $ref: '#/components/schemas/IntentTaxonomyVersion'
        intent_id:
          $ref: '#/components/schemas/IntentId'
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        risk_categories:
          $ref: '#/components/schemas/RiskCategories'
        has_conflict: { type: boolean }
        placeholder_keys:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            $ref: '#/components/schemas/PlaceholderKey'
          description: 仅声明机器键；值与渲染后正文不得进入 API 或事件。
      allOf:
        - oneOf:
            - properties:
                product_scope_type: { const: storewide }
                product_scope_refs: { maxItems: 0 }
            - properties:
                product_scope_type: { enum: [category, sku] }
                product_scope_refs: { minItems: 1 }
        - oneOf:
            - properties:
                risk_level: { enum: [low, medium] }
                risk_categories: { maxItems: 0 }
            - properties:
                risk_level: { const: high }
                risk_categories: { minItems: 1 }
    TelemetryStatus:
      type: string
      enum: [recorded, collection_disabled]
      description: |
        collection_disabled 只允许 telemetry 写故障时的无状态检索；不写 query/impression/event，
        客户端不得随后提交 adoption/escalate，该次也不进入指标。
    SearchResponse:
      type: object
      additionalProperties: false
      description: |
        检索 handler 的封闭白名单响应；顶层与每个 candidate 都禁止未声明字段。
      required: [query_id, hit_status, release_id, source_binding_hash, telemetry_status, candidates]
      properties:
        query_id:
          type: string
          format: uuid
        hit_status:
          $ref: '#/components/schemas/HitStatus'
        release_id:
          type: string
          minLength: 1
        source_binding_hash:
          $ref: '#/components/schemas/SourceBindingHash'
        telemetry_status:
          $ref: '#/components/schemas/TelemetryStatus'
        candidates:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/SearchCandidate'
      oneOf:
        - title: hit 必须返回 1 至 3 条候选
          properties:
            hit_status:
              const: hit
            candidates:
              minItems: 1
              maxItems: 3
        - title: no_hit 必须返回空候选
          properties:
            hit_status:
              const: no_hit
            candidates:
              maxItems: 0

    AdoptionOutcome:
      type: string
      enum: [adopted, dismissed, no_hit_exit, timeout]
      description: |
        adopted 仅表示候选已成功复制，不表示已发送、正确或客户已接受。timeout 是客户端
        生命周期达到 CLIENT_ACTION_TIMEOUT_MS 后上报的 terminal，不由服务端延迟推断。
    PushMethod:
      type:
        - string
        - 'null'
      enum: [clipboard, autofill, failed, pending, null]
    AdoptionEventRequest:
      oneOf:
        - $ref: '#/components/schemas/AdoptedEventRequest'
        - $ref: '#/components/schemas/NonAdoptedEventRequest'
      discriminator:
        propertyName: outcome
        mapping:
          adopted: '#/components/schemas/AdoptedEventRequest'
          dismissed: '#/components/schemas/NonAdoptedEventRequest'
          no_hit_exit: '#/components/schemas/NonAdoptedEventRequest'
          timeout: '#/components/schemas/NonAdoptedEventRequest'
    AdoptedEventRequest:
      type: object
      required: [query_id, outcome, chosen_rank, chosen_script_id, push_method]
      properties:
        query_id:
          type: string
          format: uuid
        outcome:
          const: adopted
        chosen_rank:
          type: integer
          minimum: 1
          maximum: 3
        chosen_script_id:
          type: string
          minLength: 1
        push_method:
          type: string
          enum: [clipboard, autofill]
    NonAdoptedEventRequest:
      type: object
      required: [query_id, outcome, chosen_rank, chosen_script_id, push_method]
      properties:
        query_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [dismissed, no_hit_exit, timeout]
        chosen_rank:
          type: 'null'
        chosen_script_id:
          type: 'null'
        push_method:
          $ref: '#/components/schemas/PushMethod'
    AdoptionEventResponse:
      type: object
      required: [ok, query_id]
      properties:
        ok:
          const: true
        query_id:
          type: string
          format: uuid
    EscalationAction:
      type: string
      enum: [open_feishu, copy_contact, other]
    EscalationRequest:
      type: object
      required: [query_id, action]
      properties:
        query_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/EscalationAction'
    EscalationResponse:
      type: object
      required: [escalate_id, query_id, action]
      properties:
        escalate_id:
          type: string
          minLength: 1
        query_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/EscalationAction'

    Rate:
      type: number
      format: double
      minimum: 0
      maximum: 1
    ToolMetricsResponse:
      type: object
      required:
        - root_question_count
        - search_operation_count
        - reselection_count
        - root_adopted_count
        - operation_adopted_count
        - root_adoption_rate
        - operation_adoption_rate
        - operation_no_hit_count
        - operation_no_hit_rate
        - top1_copy_share
        - root_escalated_count
        - escalate_action_count
        - root_escalation_rate
        - p95_latency_ms
      properties:
        root_question_count:
          type: integer
          minimum: 0
          description: interaction_reason=original 的根问题数。
        search_operation_count:
          type: integer
          minimum: 0
          description: 全部 query 操作数；包含 original 与 reselection。
        reselection_count:
          type: integer
          minimum: 0
          description: interaction_reason=reselection 的操作数。
        root_adopted_count:
          type: integer
          minimum: 0
          description: 任一链上操作成功复制的去重根问题数，不代表已发送或正确。
        operation_adopted_count:
          type: integer
          minimum: 0
          description: outcome=adopted 的搜索操作数，只表示成功复制。
        root_adoption_rate:
          $ref: '#/components/schemas/Rate'
          description: root_adopted_count / root_question_count；无分母时返回 0。
        operation_adoption_rate:
          $ref: '#/components/schemas/Rate'
          description: operation_adopted_count / search_operation_count；无分母时返回 0。
        operation_no_hit_count:
          type: integer
          minimum: 0
          description: hit_status=no_hit 的搜索操作数。
        operation_no_hit_rate:
          $ref: '#/components/schemas/Rate'
          description: operation_no_hit_count / search_operation_count；无分母时返回 0。
        top1_copy_share:
          $ref: '#/components/schemas/Rate'
          description: chosen_rank=1 的成功复制操作 / operation_adopted_count；无分母时返回 0。
        root_escalated_count:
          type: integer
          minimum: 0
          description: 链内至少有一个辅助升级动作的去重根问题数。
        escalate_action_count:
          type: integer
          minimum: 0
          description: 全部去重 (query_id, action) 动作数；同一 query 可贡献多个不同 action。
        root_escalation_rate:
          $ref: '#/components/schemas/Rate'
          description: root_escalated_count / root_question_count；非解决率，无分母时返回 0。
        p95_latency_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 有录制查询时返回延迟 P95；空窗口返回 null，不用 0 冒充未知。
    MetricCandidate:
      type: object
