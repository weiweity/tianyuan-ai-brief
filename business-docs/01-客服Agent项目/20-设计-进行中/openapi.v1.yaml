        source_record_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        category: { type: [string, 'null'] }
        issue_type: { type: [string, 'null'] }
        product_ref_hash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        channel: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        opened_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        handling_seconds: { type: [integer, 'null'], minimum: 0 }
        error_type: { type: [string, 'null'] }
        escalated: { type: boolean }
        quality_tags:
          type: array
          uniqueItems: true
          items: { type: string }
        normalization_version: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
    WorkOrderRecordListResponse:
      type: object
