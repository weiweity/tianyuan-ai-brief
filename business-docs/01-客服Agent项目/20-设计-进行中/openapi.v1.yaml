        script_id:
          type: string
          minLength: 1
        script_version:
          type: integer
          minimum: 1
        content_hash:
          $ref: '#/components/schemas/ContentHash'
        source_ref:
          $ref: '#/components/schemas/SafeSourceRef'
        source_version_id:
          $ref: '#/components/schemas/AuthoritativeSourceVersionId'
        effective_from:
          type: [string, 'null']
          format: date-time
        effective_to:
          type: [string, 'null']
          format: date-time
        review_due_at:
          type: string
          format: date-time
    MetricsStreamItem:
      type: object
      required:
        - query_id
        - root_query_id
        - parent_query_id
        - interaction_reason
        - user_id
        - query_text_redacted
        - text_storage_status
        - platform
        - platform_source
        - hit_status
        - outcome
        - chosen_rank
        - push_method
        - release_id
        - latency_ms
        - created_at
        - escalate_actions
        - candidates
      properties:
        query_id:
          type: string
          format: uuid
        root_query_id:
          type: string
          format: uuid
          description: 沿 parent_query_id 追溯得到的 original query_id。
        parent_query_id:
          type: [string, 'null']
          format: uuid
        interaction_reason:
          $ref: '#/components/schemas/InteractionReason'
        user_id:
          type: string
          minLength: 1
        query_text_redacted:
          type: [string, 'null']
