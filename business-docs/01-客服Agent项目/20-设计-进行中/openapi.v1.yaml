          - SOURCE_NOT_ELIGIBLE
          - SOURCE_SUSPENDED
          - SOURCE_BASE_RELEASE_STALE
        excluded-reasons-standard-audit: [GOVERNANCE_HASH_MISMATCH, QUALITY_GATE_NOT_PASSED]
