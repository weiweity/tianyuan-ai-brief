        by_issue_type:
          type: array
          items: { $ref: '#/components/schemas/WorkOrderDimensionBucket' }
        by_error_type:
          type: array
          items: { $ref: '#/components/schemas/WorkOrderDimensionBucket' }
        handling_time:
          $ref: '#/components/schemas/WorkOrderHandlingTime'
        trend:
          type: array
          items: { $ref: '#/components/schemas/WorkOrderTrendPoint' }
