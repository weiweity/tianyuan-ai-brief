          type: string
          format: date-time
    WorkOrderRecord:
      type: object
      additionalProperties: false
      description: 标准化白名单投影；不含原始客户、订单或工单长编号。
      required:
        - record_id
        - import_batch_id
        - source_record_hash
        - escalated
        - quality_tags
        - normalization_version
        - created_at
      properties:
        record_id: { type: string, minLength: 1 }
