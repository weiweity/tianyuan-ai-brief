  /v1/content/publish:
    post:
      tags: [content]
      operationId: publishContent
      summary: 将 staged 批次发布为新的 current release
      description: |
        一期仅 Owner。调用受控 publish_content_release 事务并使用全站 try-lock；第二个
        并发发布立即返回 409。发布必须 CAS 校验 base_release_id，原子写入四域绑定、内容
        快照、current、公告与审计。被本批次绑定的域按全域快照替换，不保留该域旧来源残行。
        只发布 `quality_status=clean AND quality_gate_passed=true` 的行，且二次计算
        `SHA-256(JCS(normalized governance snapshot))`；quarantined 行保留在导入证据中而不进 release。
      x-required-roles: [owner]
      x-phase1-owner-only: true
      x-error-reasons:
        '400': [SOURCE_SET_INCOMPLETE, SOURCE_BINDING_HASH_MISMATCH, GOVERNANCE_HASH_MISMATCH, QUALITY_GATE_NOT_PASSED]
        '403': [SOURCE_NOT_ELIGIBLE, SOURCE_SUSPENDED]
        '409': [SOURCE_BASE_RELEASE_STALE, SOURCE_BINDING_HASH_MISMATCH]
      x-rejection-audit:
        transaction: independent-after-rollback
        commit-before-response: true
        storage: source_denial_audits
        function: record_admin_source_denial_audit
        operation: content_publish
