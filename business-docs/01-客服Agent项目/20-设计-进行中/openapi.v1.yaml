          maximum: 3
        push_method:
          oneOf:
            - $ref: '#/components/schemas/PushMethod'
            - type: 'null'
        release_id:
          type: string
          minLength: 1
        latency_ms:
          type: [integer, 'null']
          minimum: 0
        created_at:
          type: string
          format: date-time
        escalate_actions:
          type: array
          description: 非终态辅助事实；按 action 去重，不证明外部人工已接单或已解决。
          maxItems: 3
