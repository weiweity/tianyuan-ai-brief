<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI 赋能立项 · 金主一页</title>
  <!-- 壳文件：禁止在此写业务文案。内容见 data/content.json · 架构见 ARCHITECTURE.md -->
  <link rel="stylesheet" href="./css/app.css"/>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="logo-wrap">
        <img id="logo-img" src="./assets/logo.png" alt="logo"/>
        <div class="logo-edit-hint">点此换图</div>
        <input id="logo-file" type="file" accept="image/*" hidden/>
      </div>
      <div class="top-mid">
        <h1 id="doc-title">加载中…</h1>
        <div class="sub" id="doc-sub"></div>
      </div>
      <div class="top-right" id="doc-role"></div>
      <div class="toolbar" aria-label="工具">
        <span id="status-pill">…</span>
        <button type="button" id="btn-edit" title="E">编辑</button>
        <button type="button" id="btn-bind" title="绑定磁盘上的 content.json">绑定源码</button>
        <button type="button" class="primary" id="btn-save" title="S">保存到源码</button>
        <button type="button" id="btn-export">导出 JSON</button>
        <button type="button" id="btn-reload">重载源码</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="章节"></nav>

    <main class="stage" id="stage"></main>

    <footer class="footer">
      <div id="footer-left"></div>
      <div class="hint" id="footer-right"></div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="./js/app.js"></script>
</body>
</html>
